<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <link rel="stylesheet" href="stylelinks.css">
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        a{
            text-decoration: none;
            color: black;
            font-weight: bolder;
        }
        a:hover{
            color: red;
            text-decoration: underline;
        }
        a:active{
            color: blue;
        }
        .especial{
            background-color: pink;
        }
        .especial::after{
            content:' <=='
        }
        .especial::before{
            content: '==> ';
        }
    </style>
</head>
<body>
    <h1>Personalizando links</h1>
    <ul>
        <li> <a href="https://github.com/Guilherme-Ferrei/Ap2" target="_blank" rel="nofollow" class="especial">  Repositorio GitHub</a></li>
        <li><a href="https://www.youtube.com/" target="_blank" rel="priv" class="especial">Canal do youtube</a></li>
        <li>Site de Curso em Vídeo</li>
    </ul>
</body>
</html>
