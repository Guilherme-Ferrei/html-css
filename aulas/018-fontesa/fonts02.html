<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
       @font-face {
        font-family: 'Love';
        src: url('fonts/myloves.ttf') format(truetype);
        font-weight: normal;
        font-size: normal;
        /*
            Tipos de format()
            - opentype(otf)
            - truetype(ttf)
            - embedded-opentype
            - truetype-att(Apple Advenced Typography)
            - svg
        */
       }
        body{
            font-family: "Libertinus Sans", sans-serif;
            font-size: 16px;
            color: black;
        }
        h1{
            font-family: 'Love', Times, serif;
            font-size: 3em;
            font-weight: normal;
            
        }
    </style>
</head>
     
</head>
<body>
    <h1>Guilherme da Silva Ferreira</h1>
    <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Placeat impedit iure perferendis ex libero distinctio voluptatibus expedita iste magni pariatur? Est asperiores perferendis porro autem officiis dicta saepe ipsum earum.</p>
</body>
</html>
