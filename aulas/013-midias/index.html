<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML</title>
</head>
<body>
    <h1>Imagem dinâmica</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplesmente aumente e diminua o tamnaho do seu navegador</p>

    <picture>
        <source media="(max-width: 750px)" srcset="imagem/foto-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagem/foto-m.png" type="image/png">
        <img src="imagem/foto-g.png" alt="Imagem flexível">
    </picture>

    <h1>Reproduzindo Áudio</h1>
    <p>Vamos aprender a reproduzir áudio em HTML</p>
    <audio src="midias/Rainbow Road - Jeremy Korpas.mp3" controls autoplay></audio>
    <!--MP3 WAV OGG-->
    
    <audio preload="auto" autoplay controls loop>
        <source src="midias/Rainbow Road - Jeremy Korpas.mp3" type="audio/mpeg">
        <source src="midias/Rainbow Road - Jeremy Korpas.ogg" type="audio/ogg">
        <source src="midias/Rainbow Road - Jeremy Korpas.wav" type="audio/wav">
        <p>Infelizmente seu navegador não consegue reproduzir áudio. <a href="midias/Rainbow Road - Jeremy Korpas.mp3">Clique aqui para baixar o arquivo MP3</a></p>
    </audio>
</body>
</html>
